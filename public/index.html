<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Property Listings</title>

  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
            n.callMethod.apply(n,arguments):n.queue.push(arguments)};

      n.queue=[];t=b.createElement(e);t.async=!0;

    fbq('init', '894418379733558');
    fbq('init', '901311722301515');

    // This single command sends a 'PageView' event to BOTH pixels simultaneously
    fbq('track', 'PageView');
